<!doctype html>
<meta charset="utf-8">
<title>Render regression checks</title>
<style>body { margin: 0; } pre { position: fixed; top: 0; background: white; padding: 12px; }</style>
<canvas id="viewport"></canvas>
<pre id="result">Running…</pre>
<script type="module">
  // Open /tools/render-smoke.html on the Vite server. Real WebGL checks;
  // no game archives required. Private fields are accessed only by this harness.
  import * as THREE from 'three';
  import { Session } from '/src/game/session.ts';
  import { PRESETS } from '/src/renderer/RenderSettings.ts';
  import { gradeFor } from '/src/renderer/grading/MapGrading.ts';

  const result = document.querySelector('#result');
  const canvas = document.querySelector('canvas');
  const session = new Session(canvas);
  const scratch = document.createElement('canvas');
  scratch.width = scratch.height = 1;
  const context = scratch.getContext('2d');
  const messages = [];
  function pixel() {
    context.clearRect(0, 0, 1, 1);
    context.drawImage(canvas, 0, 0, 1, 1);
    return [...context.getImageData(0, 0, 1, 1).data].slice(0, 3);
  }
  function check(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    // A resize to the existing dimensions must preserve the displayed frame.
    session.settings.patch({ ...PRESETS.high, dynamicResolution: true });
    session.scene.background = new THREE.Color(0.25, 0.25, 0.25);
    session.pipeline.setScene(session.scene, session.camera, session.settings.current);
    session.pipeline.render();
    const before = pixel();
    session.renderer.setViewport(innerWidth, innerHeight);
    check(pixel().every((value, i) => value === before[i]), 'Unchanged viewport erased the canvas');
    messages.push('PASS: unchanged viewport preserves pixels');

    // Force both directions of dynamic resolution. onStats runs after render
    // and resolution adjustment, before the browser presents the canvas.
    let frames = 0;
    let rising = false;
    const scales = new Set();
    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        session.stop();
        reject(new Error('Frame test timed out'));
      }, 20000);
      session.onStats = () => {
        try {
          check(pixel().every((value) => value > 50), `Black frame at scale ${session.renderer.renderScale}`);
          scales.add(session.renderer.renderScale.toFixed(2));
          if (session.renderer.renderScale <= 0.66) rising = true;
          if (rising && session.renderer.renderScale >= 1) {
            session.stop();
            clearTimeout(timeout);
            resolve();
            return;
          }
          check(++frames < 100, 'Dynamic resolution did not complete a down/up cycle');
          session.smoothedFrameMs = rising ? 1 : 50;
          session.scaleCooldown = 0;
        } catch (error) {
          session.stop();
          clearTimeout(timeout);
          reject(error);
        }
      };
      session.start();
    });
    messages.push(`PASS: ${frames + 1} frames, ${scales.size} resolution scales, no black frame`);

    // Default grading should not turn a black source into a grey/blue veil.
    session.settings.patch({ ...PRESETS.high, dynamicResolution: false });
    session.scene.background.setRGB(0, 0, 0);
    session.pipeline.setMapGrade(gradeFor('q3dm7'));
    session.pipeline.render();
    check(pixel().every((value) => value <= 1), 'Default grading lifts black pixels');
    messages.push('PASS: default q3dm7 grading preserves black');

    // AO uses its configured fraction of the physical buffer on HiDPI screens.
    session.renderer.webgl.setPixelRatio(2);
    session.pipeline.composer.setPixelRatio(2);
    session.resize();
    const composer = session.pipeline.composer;
    const ao = session.pipeline.aoPass;
    const bloom = session.pipeline.bloomPass;
    const aoScale = session.settings.current.aoQuality === 'ultra' ? 1 : session.settings.current.aoQuality === 'high' ? 0.75 : 0.5;
    check(ao.width === Math.round(composer.readBuffer.width * aoScale) && ao.height === Math.round(composer.readBuffer.height * aoScale),
      'AO dimensions disagree with composer at DPR 2');
    check(bloom.renderTargetBright.width === Math.round(composer.readBuffer.width / 2),
      'Bloom dimensions disagree with composer at DPR 2');
    session.pipeline.render();
    check(session.renderer.webgl.getContext().getError() === 0, 'WebGL error');
    messages.push('PASS: AO and bloom sizing at DPR 2; no WebGL error');
    result.textContent = messages.join('\n');
  } catch (error) {
    result.textContent = [...messages, `FAIL: ${error.message}`].join('\n');
    console.error(error);
  } finally {
    session.stop();
  }
</script>
